# Release: on every addon tag (Wheel-v0.6.1, Core-v0.7.0, Junk-v0.7.0-beta1...),
# build that addon's zip, create the GitHub release with its notes from
# CHANGELOG.md ('## Wheel 0.6.1') and, when the CF_API_KEY secret is set, upload
# the zip to the addon's CurseForge project. Each addon is released on its own:
# only the tagged one.
#
# An addon is uploaded when its TOC has '## X-Curse-Project-ID'. Optional repository
# variables: CF_GAME_VERSION (default 1.60.1) or CF_GAME_VERSION_ID.
name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
      CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the version
        run: python tools/release.py check "$GITHUB_REF_NAME"

      - name: Build the zip
        run: |
          python tools/package.py "${GITHUB_REF_NAME%%-v*}"
          python tools/release.py notes "$GITHUB_REF_NAME" > dist/notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME#*-v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/ImprovedForever*-"$version".zip \
            --title "Improved Forever $name $version" --notes-file dist/notes.md $prerelease

      - name: CurseForge
        if: env.CF_API_KEY != ''
        run: python tools/release.py curseforge "$GITHUB_REF_NAME"
